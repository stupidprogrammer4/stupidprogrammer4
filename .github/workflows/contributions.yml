name: Refresh Contribution Calendar

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate weekly activity graph
        run: python3 scripts/generate-activity-graph.py

      - name: Commit an updated calendar
        run: |
          if git diff --quiet -- assets/activity-graph.svg; then
            echo "Activity graph is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git commit -m "chore: refresh activity graph"
          git push
