<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img" aria-label="divider">
<defs>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
  <stop offset="45%" stop-color="#00FF41" stop-opacity="1"/>
  <stop offset="55%" stop-color="#CFFFD8" stop-opacity="1"/>
  <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
</linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>
@keyframes sw{from{transform:translateX(-420px)}to{transform:translateX(1000px)}}
.s{animation:sw 3.6s linear infinite}
</style>
<rect x="0" y="4" width="1000" height="2" fill="#00701C" opacity="0.55"/>
<g class="s"><rect x="0" y="3" width="420" height="4" fill="url(#sweep)" filter="url(#g)"/></g>
</svg>