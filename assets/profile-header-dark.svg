<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Amu Pouya — Python backend developer</title>
<desc id="desc">A realistic butterfly with iridescent blue and violet wings beside the name Amu Pouya.</desc>
<defs>
  <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0e0c1b"/><stop offset="1" stop-color="#17132d"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4a4ff"/><stop offset="1" stop-color="#7cbcff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#8b5cf6" stop-opacity=".23"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#c4a4ff" stop-opacity=".22"/><stop offset="1" stop-color="#7cbcff" stop-opacity=".04"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#393252" opacity=".55"/></pattern>
  <clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath>

</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="430" fill="url(#surface)"/>
  <rect x="620" width="580" height="430" fill="url(#dots)"/>
  <ellipse cx="936" cy="215" rx="290" ry="300" fill="url(#aura)"/>
  <path d="M0 429H1200" stroke="url(#spectrum)" stroke-width="3" opacity=".6"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="15" fill="#b1a8cc">
    <circle cx="64" cy="43" r="5" fill="#a78bfa"/><circle cx="84" cy="43" r="5" fill="#818cf8"/><circle cx="104" cy="43" r="5" fill="#60a5fa"/>
    <text x="130" y="48">~/stupidprogrammer4</text>
    <text x="1128" y="48" text-anchor="end" fill="#c4a4ff">main ↗</text>
  </g>
  <path d="M56 73H1144" stroke="#393252" opacity=".7"/>
  <text x="64" y="119" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="4" fill="#c4a4ff">BACKEND / OPEN SOURCE</text>
  <g font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-weight="800" letter-spacing="-5">
    <text x="57" y="227" font-size="108" fill="#f3efff">AMU</text>
    <text x="57" y="331" font-size="108" fill="url(#spectrum)">POUYA<tspan fill="#f3efff" font-size="74">.</tspan></text>
  </g>
  <text x="64" y="381" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#b1a8cc">Python backends. Open-source tools.</text>
<image x="750" y="60" width="360" height="340" href="butterfly.png"/>
  <text x="1127" y="389" text-anchor="end" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2" fill="#b1a8cc">BUILD · CONNECT · REPEAT</text>
</g>
</svg>
